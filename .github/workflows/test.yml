# Frontend unit tests. Put this file in the repository root at .github/workflows/
# (or merge the job into your existing pipeline). FRONTEND_DIR must point at the
# folder that contains the frontend package.json.
name: Frontend unit tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

env:
  FRONTEND_DIR: frontend

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - run: npm ci

      # Fails the job (and every job that `needs:` it) when a test fails
      # or when coverage drops below the thresholds in jest.config.cjs.
      - name: Run unit tests
        run: npm run test:ci

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Frontend coverage", "| Metric | % | Covered |", "|---|---|---|",
                ...["statements","branches","functions","lines"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            ${{ env.FRONTEND_DIR }}/coverage/
            ${{ env.FRONTEND_DIR }}/reports/junit.xml
          if-no-files-found: warn

  # Example of a downstream job: it only runs when the unit tests pass.
  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run build --if-present

  # Slower checks of test quality, run on demand from the Actions tab.
  test-quality:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci
      - name: Injected bugs must be caught
        run: npm run test:bugs
      - name: Mutation testing (Stryker)
        run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: ${{ env.FRONTEND_DIR }}/reports/mutation/
